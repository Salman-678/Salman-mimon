<title>Haji Salman Memon | Trading Community</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#3b2d0b,#090909 65%);color:#fff;font-family:Arial,sans-serif;line-height:1.5}
main{max-width:900px;margin:auto;padding:24px 14px 38px}.panel{text-align:center;padding:25px 16px 28px;border:1px solid #c99b24;border-radius:24px;background:linear-gradient(145deg,#17140d,#080808);box-shadow:0 15px 50px #0009}
.logo{width:min(82vw,370px);aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #f3c746;box-shadow:0 0 28px #e7b52d55}
.kicker{margin:22px 0 6px;color:#f6d978;letter-spacing:3px;text-transform:uppercase;font-size:12px;font-weight:bold}
h1{margin:0;color:#ffdf75;font-size:clamp(30px,6vw,48px);line-height:1.12}.intro{max-width:600px;margin:13px auto 20px;color:#e5dfd1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px;margin:20px auto}
.stat{border:1px solid #8c6c24;border-radius:15px;background:#100e09;padding:14px 8px}.stat b{display:block;color:#f5cf58;font-size:clamp(25px,5vw,34px)}.stat span{font-size:12px;color:#c9c0ad;letter-spacing:1px;text-transform:uppercase}
.join{display:inline-block;margin:8px 0 12px;padding:15px 25px;border-radius:999px;background:linear-gradient(135deg,#ffe89b,#dca91d);color:#171006;text-decoration:none;font-weight:800;font-size:17px}
.linkbox{max-width:590px;margin:8px auto 0;padding:13px 14px;border:1px dashed #d4ad42;border-radius:12px;background:#080808;color:#f8df91;overflow-wrap:anywhere;font-size:14px}
.linkbox a{color:#f8df91;text-decoration:underline}
.section{margin-top:18px;padding:21px;border:1px solid #ffffff24;border-radius:18px;background:#ffffff09}h2{margin:0 0 8px;color:#ffdf75;font-size:21px}.section p{margin:0;color:#ded8cc}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:17px}.tag{border:1px solid #927329;border-radius:99px;padding:7px 11px;color:#f2d98e;font-size:12px}
.note{max-width:760px;margin:20px auto 0;color:#aaa393;text-align:center;font-size:11px}footer{text-align:center;color:#827968;font-size:12px;margin-top:16px}
@media(max-width:440px){main{padding:12px 10px 28px}.panel{padding:18px 11px 22px}.linkbox{font-size:12px}}
</style>
</head>
