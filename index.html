:root{--gold:#f5c84b;--gold2:#ffe89a;--bg:#080808;--panel:#141414;--muted:#b7b7b7}

body{margin:0;background:radial-gradient(ellipse at 50% 0%,#30250b 0%,#111 38%,#080808 72%);color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1080px,92%);margin:auto}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid #ffffff18}

.num{font-size:clamp(28px,5vw,40px);font-weight:900;color:var(--gold)} .label{color:#bbb;font-size:13px;margin-top:7px;letter-spacing:1px;text-transform:uppercase}
.section{padding:30px 0 65px;text-align:center} h2{font-size:28px;margin:0 0 12px} h2 span{color:var(--gold)}
.info{max-width:720px;margin:0 auto;background:#121212;border:1px solid #ffffff16;border-radius:18px;padding:25px;color:#c9c9c9;line-height:1.8}
.notice{font-size:12px;color:#888;line-height:1.6;margin:22px auto 0;max-width:760px}
